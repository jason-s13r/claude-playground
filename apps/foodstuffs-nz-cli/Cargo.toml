[package]
name = "foodstuffs-nz-cli"
version = "0.3.1"
edition = "2021"
description = "Unofficial CLI for New World and PAK'nSAVE (Foodstuffs NZ) product search"
license = "MIT"

[[bin]]
name = "fsnz"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
comfy-table = "7"
directories = "6"
flate2 = "1"
owo-colors = { version = "4", features = ["supports-colors"] }
keyring = "4"
rpassword = "7"
uuid = { version = "1", features = ["v4"] }
# reqwest with a browser TLS and HTTP/2 fingerprint. Not swappable for reqwest:
# see src/http.rs.
wreq = { version = "0.16", features = ["json", "cookies", "gzip", "brotli"] }
wreq-util = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs"] }
toml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"

[profile.release]
strip = true
