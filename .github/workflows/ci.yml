name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository: the job checks out and runs dispat.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # dispat plans from tags and commit history
          # The real head, not the PR merge commit: dispat reads the scopes off
          # these commits, and a merge commit has none.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: yohimik/dispat@v1

      # ubuntu-latest already ships gcc, make, go, rust, node and python, so
      # most projects need no setup at all. Add a setup step here only if a
      # project needs a toolchain or version the runner does not provide.
      - name: Toolchain versions
        run: |
          for c in make cc go cargo node npm python3; do
            printf '%-8s %s\n' "$c" "$(command -v "$c" >/dev/null 2>&1 && "$c" --version 2>&1 | head -1 || echo 'not installed')"
          done

      # What `--since` compares against. A push or PR checks only what its own
      # commits address; a manual run checks everything.
      - name: Pick the revision to check since
        id: since
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              git fetch --no-tags origin "$BASE_REF"
              since=$(git merge-base FETCH_HEAD HEAD)
              ;;
            push)
              # A force-push leaves `before` unreachable; the previous commit
              # is the honest fallback.
              if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                since="$BEFORE"
              else
                since="HEAD~1"
              fi
              ;;
            *)
              since=all
              ;;
          esac
          echo "rev=$since" >>"$GITHUB_OUTPUT"
          echo "checking since $since" >>"$GITHUB_STEP_SUMMARY"

      # `--consumers` widens the selection to every project that depends on a
      # selected one, so a change to net-kit still rebuilds the CLIs that carry
      # it. A project that defines no `check` script is skipped, and one
      # failing does not stop the others.
      - name: dispat run check
        run: dispat run check --since "${{ steps.since.outputs.rev }}" --consumers
