name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository: the job checks out and runs dispat.
permissions:
  contents: read

jobs:
  # dispat discovers the projects itself, so there is no list to keep and no
  # matrix to build. `--since all` widens the selection past the release
  # window to every package, because CI checks the whole repo rather than only
  # what a release would touch. A package that defines no `check` script is
  # skipped, and one failing does not stop the others.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # dispat plans from tags and commit history

      - uses: yohimik/dispat@v1

      # ubuntu-latest already ships gcc, make, go, rust, node and python, so
      # most projects need no setup at all. Add a setup step here only if a
      # project needs a toolchain or version the runner does not provide.
      - name: Toolchain versions
        run: |
          for c in make cc go cargo node npm python3; do
            printf '%-8s %s\n' "$c" "$(command -v "$c" >/dev/null 2>&1 && "$c" --version 2>&1 | head -1 || echo 'not installed')"
          done

      - name: dispat run check
        run: dispat run check --since all
