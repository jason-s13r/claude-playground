name: Release

# Releases are driven by conventional commits, not by pushing a tag. dispat
# reads the commits since each project's last tag, works out which projects
# changed and what their next versions are, and releases only those. A push
# that changes nothing releasable is a no-op.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A second release while one is running would race it for tags. dispat takes
# its own lock as well, and refuses rather than races.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # What is releasing, and which runners have to build it. dispat answers the
  # first half; scripts/release-matrix.sh pairs it with each project's declared
  # platforms, because dispat runs a package's stages on one machine and a
  # project shipping several binaries needs one runner each. Each row carries
  # the project's directory too, since a package may live in either space.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: yohimik/dispat@v1

      - id: plan
        run: |
          set -euo pipefail
          matrix="$(scripts/release-matrix.sh)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = "{}" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "nothing to release"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
          dispat status

  # One job per project per platform. There is no cross-compiling: a platform
  # is built on its own runner or not at all.
  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      # A release missing one platform's binary is worse than no release, so
      # one failing leg stops the rest before anything is published.
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    name: build (${{ matrix.package }} on ${{ matrix.platform }})
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: yohimik/dispat@v1

      # Run on every platform being shipped, not just one. A tool that builds
      # on Linux and fails its tests on macOS should not get as far as a
      # published macOS binary. No --since here: the release window is exactly
      # the packages being released, so the version stamped into the artifact
      # is the one being released rather than the one already out.
      - name: dispat run check
        run: dispat run check -p '${{ matrix.package }}'

      - name: dispat run release-build
        run: dispat run release-build -p '${{ matrix.package }}'

      # SHA256SUMS is written once, in the release job, over every platform's
      # files at once. This leg contributes only its own binaries.
      - uses: actions/upload-artifact@v4
        with:
          name: release--${{ matrix.package }}--${{ matrix.platform }}
          path: |
            ${{ matrix.dir }}/release/*
            !${{ matrix.dir }}/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [plan, build]
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: yohimik/dispat@v1

      - uses: actions/download-artifact@v4
        with:
          pattern: release--*
          path: downloaded

      # dispat's build stage expects one directory per package. Artifact names
      # carry the package, so the platform legs fold back together here.
      - name: Arrange staging
        run: |
          set -euo pipefail
          mkdir -p staging
          for dir in downloaded/*/; do
            name="$(basename "$dir")"
            package="${name#release--}"
            package="${package%%--*}"
            mkdir -p "staging/$package"
            for file in "$dir"*; do
              [ -e "$file" ] || continue
              base="$(basename "$file")"
              if [ -e "staging/$package/$base" ]; then
                echo "::error::two runners both produced $base for $package"
                exit 1
              fi
              mv "$file" "staging/$package/$base"
            done
          done
          find staging -type f | sort

      # The release commit autoVersion writes needs an author.
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Versions the manifests, collects the staged artifacts, writes the
      # changelogs, makes the release commit, tags it, pushes both, and creates
      # the GitHub releases with the binaries and their checksums attached.
      # The push is dispat's own (commit.push), not a step here: it tags the
      # release commit rather than the one before it.
      - name: dispat release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_ROOT: ${{ github.workspace }}/staging
        run: dispat --log-format json

