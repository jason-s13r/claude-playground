name: Release

# Releases are per project, so tags are namespaced: <project>/vX.Y.Z
# e.g. `git tag port-scan/v0.2.0 && git push origin port-scan/v0.2.0`.
# Projects version independently -- one project's release says nothing about
# any other's.
on:
  push:
    tags: ["*/v*"]
  workflow_dispatch:
    inputs:
      project:
        description: Project to release
        required: true
      version:
        description: Version, without the leading v (e.g. 0.2.0)
        required: true
      dry_run:
        description: Build and verify, but do not publish
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Only the publish job writes anything.
permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.resolve.outputs.project }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve project and version
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            project='${{ inputs.project }}'
            version='${{ inputs.version }}'
            tag="$project/v$version"
            dry_run='${{ inputs.dry_run }}'
          else
            tag="${GITHUB_REF_NAME}"
            project="${tag%%/*}"
            rest="${tag#*/}"
            version="${rest#v}"
            dry_run=false
          fi

          if [ "$project" = "$tag" ] || [ -z "$project" ] || [ -z "$version" ]; then
            echo "::error::malformed tag '$tag'; expected <project>/vX.Y.Z"
            exit 1
          fi

          # Semver, optionally with a prerelease and/or build suffix.
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a valid semver version"
            exit 1
          fi

          if [ ! -f "projects/$project/Makefile" ]; then
            echo "::error::no such project: $project"
            echo "known projects: $(scripts/list-projects.sh | tr '\n' ' ')"
            exit 1
          fi

          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac

          {
            echo "project=$project"
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
          echo "releasing $project $version (prerelease=$prerelease, dry_run=$dry_run)"

      # Some ecosystems bake the version into the artifact from a manifest
      # rather than taking it from the tag. Publishing then produces a file
      # labelled with the manifest's version while the release claims the
      # tag's. Refuse rather than ship something mislabelled.
      - name: Check the tag agrees with the project manifest
        run: |
          set -uo pipefail
          project='${{ steps.resolve.outputs.project }}'
          version='${{ steps.resolve.outputs.version }}'

          declared="$(scripts/project-version.sh "$project")"
          rc=$?

          if [ "$rc" -eq 3 ]; then
            echo "$project declares no version manifest; the tag is authoritative"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::could not read $project's declared version"
            exit 1
          fi
          if [ "$declared" != "$version" ]; then
            echo "::error::tag says $version but $project's manifest says $declared; bump the manifest and re-tag"
            exit 1
          fi
          echo "manifest agrees: $declared"

      # Binaries cannot be cross-compiled here, so a project shipping for more
      # than one platform is built once per platform on its own runner. What
      # those are is the project's business: it declares them with a
      # `release-platforms` target, and gets ubuntu-latest if it declares
      # nothing.
      - name: Resolve build platforms
        id: platforms
        run: |
          set -euo pipefail
          platforms="$(scripts/release-platforms.sh '${{ steps.resolve.outputs.project }}' --json)"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "building on: $platforms"

  build:
    needs: resolve
    strategy:
      # A release missing one platform's binary is worse than no release at
      # all, so one failing leg stops the rest before anything is published.
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.resolve.outputs.platforms) }}
    runs-on: ${{ matrix.platform }}
    name: build (${{ matrix.platform }})
    steps:
      - uses: actions/checkout@v5

      # Run on every platform being shipped, not just one. A tool that builds
      # on Linux and fails its tests on macOS should not get as far as a
      # published macOS binary.
      - name: make check
        run: make check P=${{ needs.resolve.outputs.project }}

      - name: make dist
        run: make dist P=${{ needs.resolve.outputs.project }} VERSION=${{ needs.resolve.outputs.version }}

      - name: Check this platform produced something
        run: |
          set -euo pipefail
          dir="projects/${{ needs.resolve.outputs.project }}/release"
          if [ ! -d "$dir" ] || [ -z "$(ls -A "$dir" 2>/dev/null)" ]; then
            echo "::error::${{ needs.resolve.outputs.project }}'s dist target produced no artifacts in $dir"
            exit 1
          fi
          ls -lh "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: projects/${{ needs.resolve.outputs.project }}/release/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # release notes diff against the previous tag

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: staging

      # One directory holding every platform's artifacts, and one SHA256SUMS
      # over the lot. Computed here rather than per platform so the file covers
      # the whole release and is produced by one `sha256sum` implementation.
      - name: Collect artifacts
        id: artifacts
        run: |
          set -euo pipefail
          mkdir -p release

          for dir in staging/*/; do
            for file in "$dir"*; do
              [ -e "$file" ] || continue
              base="$(basename "$file")"
              # Artifacts are named per platform, so a clash means `dist`
              # ignored the platform it ran on and one binary would silently
              # overwrite another.
              if [ -e "release/$base" ]; then
                echo "::error::two platforms both produced $base; dist must name artifacts per platform"
                exit 1
              fi
              mv "$file" "release/$base"
            done
          done

          if [ -z "$(ls -A release 2>/dev/null)" ]; then
            echo "::error::no artifacts to publish"
            exit 1
          fi

          ( cd release && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS )
          echo "artifacts:"
          ls -lh release
          cat release/SHA256SUMS

      # Notes cover only this project's commits since its own previous tag --
      # in a monorepo, auto-generated notes would list every other project's
      # commits too. Two things make a commit this project's:
      #
      #   1. it touched projects/<project>, or
      #   2. its conventional-commit scope names the project.
      #
      # (2) exists because the path filter alone drops changes that are about
      # a project without living in its directory -- CI, this workflow, a
      # shared script. `fix(<project>): ...` puts those in the right notes.
      - name: Build release notes
        id: notes
        run: |
          set -euo pipefail
          project='${{ needs.resolve.outputs.project }}'
          tag='${{ needs.resolve.outputs.tag }}'

          prev="$(git tag --list "$project/v*" --sort=-version:refname \
                  | grep -vFx "$tag" | head -1 || true)"

          : > /tmp/subjects
          if [ -n "$prev" ]; then
            # Scope separators are spelled out rather than using \b, which
            # treats `-` as a boundary and would match `foodstuffs-nz` inside
            # a `foodstuffs-nz-cli` scope. Trailing `!` is a breaking change.
            scope="^[a-zA-Z]+\(([^)]*[, ])?$project([, ][^)]*)?\)!?:"

            {
              git log --no-merges --format=%H "$prev..HEAD" -- "projects/$project"
              git log --no-merges --format=%H --extended-regexp --grep="$scope" "$prev..HEAD"
            } | sort -u > /tmp/hashes

            # Re-walk the range so the union comes back in commit order.
            if [ -s /tmp/hashes ]; then
              git log --no-merges --format='%H%x09%s' "$prev..HEAD" \
                | grep -Ff /tmp/hashes \
                | cut -f2 \
                | sed 's/^/- /' > /tmp/subjects
            fi
          fi

          {
            if [ -z "$prev" ]; then
              echo "First release of \`$project\`."
            elif [ -s /tmp/subjects ]; then
              echo "Changes to \`$project\` since \`$prev\`:"
              echo
              cat /tmp/subjects
            else
              echo "No changes to \`$project\` since \`$prev\`."
            fi
            echo
            echo "Built on: ${{ join(fromJSON(needs.resolve.outputs.platforms), ', ') }}."
            echo "Verify downloads against \`SHA256SUMS\`."
          } > /tmp/notes.md

          cat /tmp/notes.md

      - name: Publish
        if: needs.resolve.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create '${{ needs.resolve.outputs.tag }}' \
            --title '${{ needs.resolve.outputs.project }} ${{ needs.resolve.outputs.version }}' \
            --notes-file /tmp/notes.md \
            ${{ needs.resolve.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            release/*

      - name: Dry run summary
        if: needs.resolve.outputs.dry_run == 'true'
        run: |
          echo "dry run: built and verified, nothing published"
