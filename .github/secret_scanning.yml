# Files that hold vendor identifiers, not credentials.
#
# `vendor.rs` is the one place a project keeps the public strings its vendor's
# own front end ships to every visitor -- an OAuth client id for a single-page
# app, a read-only search index key. They are high-entropy and look exactly
# like leaked credentials, because that is what high-entropy strings look like.
#
# The exemption is what makes the convention worth having, and its price is
# that nothing which is actually secret may go in one. Credentials belong in
# the OS keyring, via `net_kit::Secrets`, and no project here writes one to
# disk in the clear.
paths-ignore:
  - "packages/*/src/vendor.rs"
  - "apps/*/src/vendor.rs"
