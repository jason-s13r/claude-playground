tagFormat: "{name}/v{version}"

github:
  allPackages: true

commit:
  enabled: true
  push: true

# Two kinds of package, both discovered by directory. `apps` ship; `packages`
# are libraries the apps use. Both version the same way, so releasing a library
# rewrites the range in every app that depends on it.
spaces:
  apps:
    path: apps
    autoVersion:
      enabled: true
      range: caret
  packages:
    path: packages
    autoVersion:
      enabled: true
      range: caret

# The first cross-project dependencies in the repo. Each consumer also declares
# a path dependency carrying a version in its own Cargo.toml; this block is what
# orders the builds and propagates a library's bump onward.
#
# The library-to-library edges are the ones that are easy to forget and
# expensive to omit: without them, releasing net-kit rewrites only the app's
# range and leaves the api crates pinned to a version that no longer exists.
dependencies:
  build-kit: [net-kit]
  gsnz-ui: [gsnz-core, cli-kit]
  fsnz-api: [net-kit]
  wwnz-api: [net-kit]
  foodstuffs-nz-cli: [gsnz-core, gsnz-ui, cli-kit, net-kit, fsnz-api, build-kit]
  grocery-nz-cli: [gsnz-core, gsnz-ui, cli-kit, net-kit, fsnz-api, wwnz-api, build-kit]
